name: Chennai Rain Watch

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC.
    # Every 15 minutes.
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  check-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore previous weather state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: rain-watch-state-${{ github.run_id }}
          restore-keys: |
            rain-watch-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check IMD Chennai
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python weather_check.py

      - name: Save latest weather state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: rain-watch-state-${{ github.run_id }}
